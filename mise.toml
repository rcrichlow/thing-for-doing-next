[tasks.dev]
description = "Run the development server with hot reload"
run = "docker compose up --build app-dev"

[tasks.prod]
description = "Run the production-style image"
run = "docker compose --profile production up --build app"

[tasks.down]
description = "Stop application services"
run = "docker compose down"

[tasks.test]
description = "Run Zig tests in the development container"
run = "docker compose run --rm app-dev sh -c 'tailwindcss --input src/public/input.css --output src/public/app.css && zig build test'"
