[tasks.dev]
description = "Run the development server with hot reload"
run = "docker compose up --build app-dev"

[tasks.prod]
description = "Run the production-style image"
run = "docker compose --profile production up --build app"

[tasks.down]
description = "Stop application services"
run = "docker compose down"

[tasks.e2e]
description = "Run browser tests against an isolated server and database (args go to playwright test)"
run = "scripts/e2e"

[tasks.test]
description = "Run Zig tests, including database integration tests, in the development container"
run = [
  "docker compose up --detach --wait db",
  "docker compose exec -T db sh -c 'psql -U thing_for_doing -d thing_for_doing_next -lqt | cut -d\"|\" -f1 | grep -qw thing_for_doing_next_test || createdb -U thing_for_doing thing_for_doing_next_test'",
  "docker compose run --build --rm -e TEST_DATABASE_URL=postgresql://thing_for_doing:thing_for_doing@db:5432/thing_for_doing_next_test app-dev sh -c 'tailwindcss --input src/public/input.css --output src/public/app.css && zig build test --summary all'",
]
