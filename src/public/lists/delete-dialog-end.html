                </select>
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-3 border-t border-zinc-800 pt-4">
            <button
                type="button"
                data-modal-close
                class="rounded-md border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition-colors hover:bg-zinc-800 disabled:cursor-not-allowed disabled:opacity-50">
                Cancel
            </button>
            <button
                type="submit"
                data-testid="confirm-delete-list-btn"
                class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50">
                Delete list
            </button>
        </div>
    </form>
</dialog>
