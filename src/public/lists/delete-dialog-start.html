<dialog
    data-modal
    data-testid="list-delete-modal"
    aria-labelledby="list-delete-modal-title"
    class="m-auto w-[calc(100%-2rem)] max-w-xl bg-transparent p-0 text-zinc-100 backdrop:bg-black/70 backdrop:backdrop-blur-sm">
    <form
        class="w-full rounded-xl bg-zinc-900 border border-zinc-800 p-6 shadow-2xl"
        hx-delete="/lists/{{id}}"
        hx-target="#list-{{id}}"
        hx-swap="outerHTML"
        hx-confirm="Are you sure you want to delete this list? All cards in it will also be deleted. This action cannot be undone.">
        <div class="mb-4 flex items-start justify-between gap-4">
            <div>
                <h2 id="list-delete-modal-title" class="text-xl font-bold text-zinc-100 tracking-tight">Delete list</h2>
                <p class="mt-1 text-sm text-zinc-400">Optionally move cards before deleting this list.</p>
            </div>
            <button
                type="button"
                data-modal-close
                aria-label="Close"
                class="rounded-md p-2 text-zinc-500 transition-colors hover:bg-zinc-800 hover:text-zinc-300">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="space-y-4">
            <div class="rounded-lg border border-zinc-700 bg-zinc-800 p-4">
                <p class="text-sm text-zinc-300">
                    <span class="font-semibold text-zinc-100">{{title}}</span> has {{count}}.
                </p>
                <p class="mt-2 text-sm text-zinc-400">
                    Choose another list to keep those cards, or leave the selection empty to delete them with this list.
                </p>
            </div>
            <div>
                <label for="transfer-list" class="mb-2 block text-sm font-medium text-zinc-400">
                    Transfer cards to
                </label>
                <select
                    id="transfer-list"
                    name="transfer_list_id"
                    data-sets-confirm
                    data-testid="transfer-list-select"
                    class="w-full rounded-md border border-zinc-700 bg-zinc-800 text-zinc-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
                    <option value="" data-confirm="Are you sure you want to delete this list? All cards in it will also be deleted. This action cannot be undone.">Don&#39;t transfer — delete cards</option>
