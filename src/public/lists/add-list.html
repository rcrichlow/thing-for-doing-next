<div class="w-80 flex-shrink-0">
    <form
        class="bg-zinc-900 bg-opacity-70 hover:bg-opacity-100 p-4 rounded-lg shadow-sm border border-zinc-800 transition-all duration-200"
        data-require-field="title"
        hx-post="/boards/{{board_id}}/lists"
        hx-target="#board-lists"
        hx-swap="innerHTML">
        <input
            id="new-list-title"
            type="text"
            name="title"
            value="{{title}}"
            aria-label="List title"
            placeholder="Enter list title..."
            autocomplete="off"
            data-testid="list-title-input"
            class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 text-zinc-100 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 placeholder-zinc-500">
        <p class="-mt-1 mb-3 text-xs text-red-400 empty:hidden" role="alert">{{message}}</p>
        <button
            type="submit"
            data-testid="add-list-btn"
            class="bg-violet-600 text-white px-4 py-2 rounded hover:bg-violet-500 transition-colors w-full disabled:opacity-50 disabled:cursor-not-allowed font-medium shadow-sm">
            Add List
        </button>
    </form>
</div>
