<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{title}}</title>
        <link rel="stylesheet" href="/assets/app.css">
        <script src="/assets/htmx-4.0.0-beta6.min.js" defer></script>
    </head>
    <body>
        <div class="min-h-screen bg-zinc-950 flex flex-col">
            <header class="bg-zinc-900 border-b border-zinc-800 shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between h-16">
                        <div class="flex">
                            <div class="flex-shrink-0 flex items-center">
                                <a href="/" class="text-xl font-bold text-zinc-100 px-2 tracking-tight">
                                    Thing For Doing
                                </a>
                            </div>
                            <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                                <a class="{{working_memory_class}}" href="/">Working Memory</a>
                                <a class="{{boards_class}}" href="/boards">Boards</a>
                            </div>
                        </div>
                    </div>
                </div> 
            </header>
            <main class="flex-1 py-6">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="space-y-6 py-2">
                        <h1 class="text-3xl font-bold text-zinc-100 tracking-tight">{{heading}}</h1>
                        <p class="text-zinc-400">{{message}}</p>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
