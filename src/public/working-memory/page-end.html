        </div>
    </section>
</div>
<dialog
    id="composer"
    data-composer
    aria-labelledby="composer-title"
    class="m-auto w-[calc(100%-2rem)] max-w-xl bg-transparent p-0 text-zinc-100 backdrop:bg-black/70 backdrop:backdrop-blur-sm">
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-6 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
            <div>
                <h2 id="composer-title" class="text-lg font-semibold text-zinc-100">New working memory entry</h2>
                <p class="mt-1 text-sm text-zinc-400">Press Enter to save, Shift+Enter for multiple lines, or Escape to close.</p>
            </div>
            <button
                type="button"
                aria-label="Close"
                data-composer-close
                class="rounded-md p-1 text-zinc-400 transition-colors hover:bg-zinc-800 hover:text-zinc-200">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form
            id="working-memory-form"
            class="mt-4"
            data-require-field="content"
            hx-post="/entries"
            hx-target="#composer-error"
            hx-swap="innerHTML">
            <textarea
                name="content"
                rows="1"
                placeholder="What are you thinking?"
                aria-label="Entry"
                data-autogrow
                data-submit-on-enter
                class="max-h-[60vh] w-full resize-none rounded-md border border-zinc-700 bg-zinc-800 px-4 py-3 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea>
            <div id="composer-error" role="alert"></div>
        </form>
        <div class="mt-6 flex justify-end gap-3 border-t border-zinc-800 pt-4">
            <button
                type="button"
                data-composer-close
                class="rounded-md px-4 py-2 text-sm font-medium text-zinc-300 transition-colors hover:bg-zinc-800">
                Cancel
            </button>
            <button
                type="submit"
                form="working-memory-form"
                disabled
                class="rounded-md bg-violet-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-50">
                Save entry
            </button>
        </div>
    </div>
</dialog>
