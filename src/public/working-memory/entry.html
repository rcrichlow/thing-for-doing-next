<div id="entry-{{id}}" class="py-1" data-testid="wm-entry-{{id}}">
    <div class="flex items-center gap-2">
        <div class="flex shrink-0 items-center gap-1">
            <button
                type="button"
                aria-label="Delete entry"
                class="rounded-md p-1.5 text-red-500 transition-colors hover:bg-red-900/30 hover:text-red-400"
                hx-delete="/entries/{{id}}"
                hx-target="#entry-{{id}}"
                hx-swap="delete"
                hx-confirm="Are you sure you want to delete this working memory entry? This action cannot be undone.">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7h12m-9 0V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0v11m4-11v11m5-11v11a2 2 0 01-2 2H8a2 2 0 01-2-2V7" />
                </svg>
            </button>
            <button type="button" aria-label="Send to board"
                class="rounded-md p-1.5 text-zinc-500 transition-colors hover:bg-violet-900/20 hover:text-violet-400"
                hx-get="/entries/{{id}}/send" hx-target="#modal-root" hx-swap="innerHTML">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </div>
        <div class="min-w-0 flex-1" data-updated-at="{{updated_at}}">
            <button
                type="button"
                class="w-full whitespace-pre-wrap break-words rounded-md px-2 py-1.5 text-left text-sm text-zinc-300 transition-colors hover:bg-zinc-800/50"
                hx-get="/entries/{{id}}/edit"
                hx-target="#entry-{{id}}"
                hx-swap="outerHTML">{{content}}</button>
        </div>
    </div>
</div>
