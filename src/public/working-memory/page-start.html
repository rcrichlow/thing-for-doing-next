<div class="space-y-6 py-2">
    <h1 class="text-3xl font-bold text-zinc-100 tracking-tight">Working Memory</h1>
    <p class="text-zinc-400">Start typing anywhere</p>
    <section class="space-y-2">
        <div class="flex items-center justify-between gap-4">
            <h2 class="text-xl font-bold text-zinc-200">Entries</h2>
            <button
                type="button"
                aria-label="Clear all working memory entries"
                class="rounded-md bg-red-600/80 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-red-600"
                hx-delete="/entries"
                hx-target="#entries"
                hx-swap="innerHTML"
                hx-confirm="Are you sure you want to clear all working memory entries? This action cannot be undone.">
                Clear All
            </button>
        </div>
        <div id="entries">
