    <p role="alert" class="order-5 text-sm text-red-400" data-testid="send-to-board-error">{{message}}</p>
    <div class="order-6 mt-6 flex justify-end gap-3 border-t border-zinc-800 pt-4">
        <button type="button" data-modal-close class="rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Cancel</button>
        <button type="submit" form="send-form" {{disabled}} class="rounded-md bg-violet-600 px-4 py-2 text-sm font-medium text-white hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-50">Create card</button>
    </div>
</div>
