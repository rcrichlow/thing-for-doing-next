<dialog data-modal data-testid="send-to-board" aria-labelledby="send-title"
    class="m-auto w-[calc(100%-2rem)] max-w-xl bg-transparent p-0 text-zinc-100 backdrop:bg-black/70 backdrop:backdrop-blur-sm">
    <div class="w-full rounded-xl border border-zinc-800 bg-zinc-900 p-6 shadow-2xl">
        <div class="mb-4 flex items-start justify-between gap-4">
            <div>
                <h2 id="send-title" class="text-xl font-bold text-zinc-100">Send to board</h2>
                <p class="mt-1 text-sm text-zinc-400">Choose a board and list to create a card.</p>
            </div>
            <button type="button" data-modal-close aria-label="Close" class="rounded-md p-2 text-zinc-400 hover:bg-zinc-800">✕</button>
        </div>
        <div class="mb-4 whitespace-pre-wrap break-words rounded-md border border-zinc-700 bg-zinc-800 p-3 text-sm text-zinc-300" data-testid="send-to-board-entry-preview"><span class="font-medium text-zinc-100">Entry: </span>{{content}}</div>
