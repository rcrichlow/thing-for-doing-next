<div id="send-fields" class="flex flex-col">
    <form id="send-form" class="contents" hx-post="/entries/{{id}}/send" hx-target="#send-fields" hx-swap="outerHTML" hx-sync="#send-fields:drop">
        <div class="order-1 mb-4">
            <label for="send-board" class="mb-1 block text-sm font-medium text-zinc-400">Board</label>
            <select id="send-board" name="board_id" data-testid="send-to-board-board-select"
                hx-get="/entries/{{id}}/send/fields" hx-trigger="change" hx-include="closest form" hx-target="#send-fields" hx-swap="outerHTML"
                class="w-full rounded-md border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-violet-500">
                <option value="">Select a board</option>
