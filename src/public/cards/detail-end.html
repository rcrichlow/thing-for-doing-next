        </div>
        <div class="mt-6 flex justify-end gap-3 border-t border-zinc-800 pt-4">
            <button
                type="button"
                data-testid="card-detail-delete-btn"
                class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
                hx-delete="/cards/{{id}}"
                hx-target="#modal-root"
                hx-swap="innerHTML"
                hx-confirm="Are you sure you want to delete this card? This action cannot be undone.">
                Delete card
            </button>
            <button
                type="button"
                data-modal-close
                class="rounded-md bg-violet-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-violet-500">
                Done
            </button>
        </div>
    </div>
</dialog>
