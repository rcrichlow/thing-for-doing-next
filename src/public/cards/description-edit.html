<form
    id="card-detail-description-field"
    data-inline-edit
    data-inline-allow-blank
    hx-put="/cards/{{id}}/description"
    hx-target="this"
    hx-swap="outerHTML">
    <textarea
        name="description"
        rows="5"
        aria-label="Card description"
        placeholder="Add a description..."
        data-focus
        data-inline-field
        data-testid="card-detail-description-input"
        class="w-full rounded-md border border-zinc-700 bg-zinc-800 text-zinc-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 resize-none">
{{description}}</textarea>
    <button type="button" hidden data-inline-cancel hx-get="/cards/{{id}}/description" hx-target="#card-detail-description-field" hx-swap="outerHTML"></button>
</form>
