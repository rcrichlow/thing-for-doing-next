        <button
            type="button"
            id="card-{{id}}"
            data-testid="card-item"
            data-card="{{id}}"
            aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown Alt+ArrowLeft Alt+ArrowRight"
            class="group block w-full text-left bg-zinc-800 p-3 rounded-lg shadow-sm border border-zinc-700 hover:shadow-md hover:border-violet-500 cursor-grab active:cursor-grabbing transition-all duration-200 ease-in-out relative"
            hx-get="/cards/{{id}}"
            hx-target="#modal-root"
            hx-swap="innerHTML">
            <span class="block font-medium text-zinc-200 group-hover:text-violet-400 transition-colors break-words">{{title}}</span>
            <span class="block text-xs text-zinc-500 mt-1.5 truncate empty:hidden">{{description}}</span>
        </button>
