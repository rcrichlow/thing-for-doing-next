<form id="card-detail-title-field" data-inline-edit hx-put="/cards/{{id}}/title" hx-target="this" hx-swap="outerHTML">
    <input
        type="text"
        name="title"
        value="{{title}}"
        aria-label="Card title"
        autocomplete="off"
        data-focus
        data-inline-field
        data-testid="card-detail-title-input"
        class="w-full rounded-md border border-zinc-700 bg-zinc-800 text-zinc-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
    <button type="button" hidden data-inline-cancel hx-get="/cards/{{id}}/title" hx-target="#card-detail-title-field" hx-swap="outerHTML"></button>
</form>
