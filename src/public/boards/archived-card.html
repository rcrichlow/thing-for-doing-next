<div
    id="board-{{id}}"
    data-testid="archived-board-card"
    class="group relative h-40 overflow-hidden rounded-xl border border-zinc-800 bg-zinc-900/50 p-6 shadow-md transition-colors hover:border-zinc-600">
    <h2 class="truncate text-xl font-bold text-zinc-400">
        <a href="/boards/{{id}}" class="after:absolute after:inset-0">{{title}}</a>
    </h2>
    <p class="absolute bottom-4 left-6 text-xs text-zinc-500">Archived <time datetime="{{archived_at}}" data-local-date>{{archived_date}}</time></p>
    <div class="absolute bottom-3 right-3 z-10 flex gap-1 opacity-0 transition-opacity focus-within:opacity-100 group-hover:opacity-100">
        <button
            type="button"
            title="Unarchive Board"
            aria-label="Unarchive board {{title}}"
            data-testid="unarchive-board-{{id}}"
            class="rounded-md p-1.5 text-zinc-400 transition-colors hover:bg-zinc-800 hover:text-violet-400"
            hx-post="/boards/{{id}}/unarchive"
            hx-target="#board-{{id}}"
            hx-swap="delete">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
        </button>
        <button
            type="button"
            title="Delete Permanently"
            aria-label="Delete board {{title}} permanently"
            data-testid="delete-board-{{id}}"
            class="rounded-md p-1.5 text-red-500 transition-colors hover:bg-red-900/30 hover:text-red-400"
            hx-delete="/boards/{{id}}"
            hx-target="#board-{{id}}"
            hx-swap="delete"
            hx-confirm="Permanently delete board &quot;{{title}}&quot;? This cannot be undone.">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7h12m-9 0V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0v11m4-11v11m5-11v11a2 2 0 01-2 2H8a2 2 0 01-2-2V7" />
            </svg>
        </button>
    </div>
</div>
