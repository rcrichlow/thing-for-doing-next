<form
    id="board-title"
    data-inline-edit
    hx-put="/boards/{{id}}/title"
    hx-target="this"
    hx-swap="outerHTML">
    <input
        type="text"
        name="title"
        value="{{title}}"
        aria-label="Board title"
        autocomplete="off"
        data-focus
        data-inline-field
        data-testid="board-title-input"
        class="text-2xl font-bold bg-zinc-800 text-zinc-100 px-3 py-1 rounded focus:outline-none outline outline-1 outline-zinc-700 focus:outline-2 focus:outline-violet-500">
    <button
        type="button"
        hidden
        data-inline-cancel
        hx-get="/boards/{{id}}/title"
        hx-target="#board-title"
        hx-swap="outerHTML"></button>
</form>
