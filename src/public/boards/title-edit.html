<form
    id="board-title"
    class="min-w-0 flex-1"
    data-inline-edit
    hx-put="/boards/{{id}}/title"
    hx-target="this"
    hx-swap="outerHTML">
    <input
        type="text"
        name="title"
        value="{{title}}"
        aria-label="Board title"
        autocomplete="off"
        data-focus
        data-inline-field
        data-testid="board-title-input"
        class="w-full max-w-xl rounded-md border border-zinc-700 bg-zinc-800 px-2 py-1 text-2xl font-bold text-zinc-100 focus:outline-none focus:ring-2 focus:ring-violet-500">
    <button
        type="button"
        hidden
        data-inline-cancel
        hx-get="/boards/{{id}}/title"
        hx-target="#board-title"
        hx-swap="outerHTML"></button>
</form>
