    <div id="board-banner" class="border-b border-amber-900/50 bg-amber-900/30 px-6 py-2 text-center text-sm text-amber-200">
        This board is archived.
        <button
            type="button"
            data-testid="unarchive-board-btn"
            class="ml-2 font-medium underline hover:text-amber-100"
            hx-post="/boards/{{id}}/unarchive?from=board">
            Unarchive
        </button>
        <button
            type="button"
            data-testid="delete-board-btn"
            class="ml-2 font-medium underline hover:text-amber-100"
            hx-delete="/boards/{{id}}?from=board"
            hx-confirm="Permanently delete board &quot;{{title}}&quot;? This cannot be undone.">
            Delete Permanently
        </button>
    </div>
