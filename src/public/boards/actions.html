            <div id="board-actions" class="flex items-center gap-2">
                <button
                    type="button"
                    title="Archive Board"
                    class="rounded-md border border-zinc-700 px-3 py-1.5 text-sm font-medium text-zinc-300 transition-colors hover:bg-zinc-800"
                    hx-post="/boards/{{id}}/archive?from=board"
                    hx-confirm="Archive board &quot;{{title}}&quot;? It will be moved to Archived Boards.">
                    Archive
                </button>
                <button
                    type="button"
                    title="Delete Board"
                    class="rounded-md border border-red-900/60 px-3 py-1.5 text-sm font-medium text-red-400 transition-colors hover:bg-red-900/30"
                    hx-delete="/boards/{{id}}?from=board"
                    hx-confirm="Permanently delete board &quot;{{title}}&quot;? This cannot be undone.">
                    Delete
                </button>
            </div>
