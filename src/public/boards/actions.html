            <div id="board-actions" class="flex items-center gap-2">
                <button
                    type="button"
                    title="Archive Board"
                    class="text-zinc-400 hover:text-zinc-200 text-sm font-medium px-3 py-1.5 rounded hover:bg-zinc-800 transition-colors"
                    hx-post="/boards/{{id}}/archive?from=board"
                    hx-confirm="Archive board &quot;{{title}}&quot;? It will be moved to Archived Boards.">
                    Archive
                </button>
                <button
                    type="button"
                    title="Delete Board"
                    class="text-zinc-400 hover:text-red-400 text-sm font-medium px-3 py-1.5 rounded hover:bg-zinc-800 transition-colors"
                    hx-delete="/boards/{{id}}?from=board"
                    hx-confirm="Permanently delete board &quot;{{title}}&quot;? This cannot be undone.">
                    Delete
                </button>
                <div class="h-4 w-px bg-zinc-700"></div>
            </div>
