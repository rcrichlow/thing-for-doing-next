<div class="col-span-full flex flex-col items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900 px-6 py-16 text-center">
    <h2 class="text-xl font-bold text-zinc-200">No boards yet</h2>
    <p class="mt-2 max-w-md text-zinc-400">Create your first board to start organizing your tasks and ideas.</p>
    <button
        type="button"
        data-testid="new-board-btn"
        class="mt-6 rounded-md bg-violet-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-violet-500"
        hx-get="/boards/new"
        hx-target="#boards-grid"
        hx-swap="innerHTML">
        Create New Board
    </button>
</div>
