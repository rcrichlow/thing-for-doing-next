<h1 id="board-title" class="min-w-0 text-2xl font-bold text-zinc-100">
    <button
        type="button"
        title="Edit board title"
        class="max-w-full truncate rounded-md px-2 py-1 text-left transition-colors hover:bg-zinc-800"
        hx-get="/boards/{{id}}/title/edit"
        hx-target="#board-title"
        hx-swap="outerHTML">{{title}}</button>
</h1>
