<form
    id="board-create"
    class="flex h-40 flex-col justify-center gap-3 rounded-xl border-2 border-dashed border-violet-500 bg-zinc-900/50 p-4"
    data-cancel-on-escape
    data-require-field="title"
    hx-post="/boards"
    hx-target="this"
    hx-swap="outerHTML">
    <input
        type="text"
        name="title"
        value="{{title}}"
        placeholder="Board Title..."
        aria-label="Board title"
        autocomplete="off"
        data-focus
        data-testid="board-title-input"
        class="w-full rounded-md border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-violet-500">
    <p class="text-xs text-red-300 empty:hidden" role="alert">{{message}}</p>
    <div class="flex gap-2">
        <button
            type="submit"
            data-testid="board-submit-btn"
            class="rounded-md bg-violet-600 px-3 py-1.5 text-sm font-medium text-white transition-colors hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-50">
            Create
        </button>
        <button
            type="button"
            data-cancel
            class="rounded-md px-3 py-1.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-zinc-800 hover:text-zinc-200"
            hx-get="/boards/tile"
            hx-target="#board-create"
            hx-swap="outerHTML">
            Cancel
        </button>
    </div>
</form>
